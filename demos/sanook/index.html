<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanook Demo</title>
  <style>
    :root {
      --accent: #fc2779;
    }

    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .video-container {
      position: relative;
      width: 89.8vw;
      height: 50.625vw;
      /* 16:9 aspect ratio */
      max-width: 900px;
      max-height: 600px;
      background: #15171e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 3;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--accent);
    }

    .logo {
      height: 60px;
      margin-bottom: 24px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>
  <img src="sanook-logo.svg" id="logocontainer" class="logo" alt="Sanook">
  <div class="video-container">
    <video autoplay loop muted playsinline src="../shanghai-io-connect/mwg-sanook.mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  <script>
    const video = document.querySelector('video');
    const videoSources = [
      '../shanghai-io-connect/mwg-sanook.mp4',
      '../shanghai-io-connect/devtools-mcp-wetv.mp4'
    ];
    const logocontainer = document.querySelector('#logocontainer');
    const imgSources = [
      './sanook-logo.svg',
      '../wetv/wetv-logo.webp'
    ];
    let currentIndex = 0;

    window.focus(); // Ensure keyboard events go here immediately upon load

    function nextSlide() {
      if (currentIndex !== 1) {
        currentIndex = 1;
        video.src = videoSources[currentIndex];
        logocontainer.src = imgSources[currentIndex];
        video.play().catch(err => console.log("Playback failed:", err));
      }
    }

    function prevSlide() {
      if (currentIndex !== 0) {
        currentIndex = 0;
        video.src = videoSources[currentIndex];
        logocontainer.src = imgSources[currentIndex];
        video.play().catch(err => console.log("Playback failed:", err));
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'j' || e.code === 'Space') {
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'h') {
        prevSlide();
      }
    });

    window.addEventListener('message', (e) => {
      if (e.data && (e.data.type === 'click' || (e.data.type === 'keydown' && (e.data.key === 'j' || e.data.key === 'ArrowRight' || e.data.code === 'Space')))) {
        nextSlide();
      }
    });

    function handleHash() {
      if (window.location.hash === '#slide-2') {
        currentIndex = 1;
      } else {
        currentIndex = 0;
      }
      video.src = videoSources[currentIndex];
      video.play().catch(err => console.log("Playback failed:", err));
    }

    if (window.location.hash) {
      handleHash();
    }

    window.addEventListener('hashchange', handleHash);
  </script>
</body>

</html>
