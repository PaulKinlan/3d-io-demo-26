<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>DevTools Demo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .slides {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    /* Invisible navigation areas */
    .nav-area {
      position: absolute;
      top: 0;
      height: 100%;
      width: 25%;
      z-index: 50;
      cursor: pointer;
    }

    .nav-left {
      left: 0;
    }

    .nav-right {
      right: 0;
    }

    /* Custom Slide Layouts */
    .custom-slide {
      background: #fff;
      padding: 40px !important;
      box-sizing: border-box;
    }

    .slide-logo {
      height: 80px;
      margin-bottom: 20px;
      object-fit: contain;
    }

    .video-container {
      position: relative;
      width: 98vw;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      background: #15171e;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .big-number {
      font-size: 220px;
      font-weight: 800;
      color: #000;
      margin: 0;
      line-height: 1;
      letter-spacing: -0.05em;
      position: relative;
      z-index: 1;
    }

    .active .big-number::before {
      animation:
        fade-in-rainbow 0.5s 1s ease forwards,
        slide-rainbow 2s 1s linear infinite;
    }

    .big-number::before {
      content: "92%";
      position: absolute;
      inset: 0;
      z-index: -1;
      color: transparent;
      background: linear-gradient(to right in oklch longer hue, oklch(65% 0.3 0), oklch(65% 0.3 0));
      background-clip: text;
      -webkit-background-clip: text;
      filter: blur(15px);
      background-size: 200% 100%;
      opacity: 0;
      pointer-events: none;
    }

    @keyframes fade-in-rainbow {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slide-rainbow {
      from {
        background-position: 0% center;
      }

      to {
        background-position: -200% center;
      }
    }

    .subtitle-text {
      font-size: 28px;
      font-weight: 400;
      color: #333;
      max-width: 800px;
      text-align: center;
      margin-top: 80px;
      line-height: 1.5;
      opacity: 0;
    }

    .active .subtitle-text {
      animation: fade-in 1s 0.5s ease forwards;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <!-- Invisible click areas for clean navigation without visible buttons -->
  <div class="nav-area nav-left" id="prev" title="Previous Slide"></div>
  <div class="nav-area nav-right" id="next" title="Next Slide"></div>

  <div class="slides">
    <!-- Slide 1: Video -->
    <div class="slide custom-slide active">
      <img src="../redbus/redbus-logo.png" class="slide-logo" alt="redBus Logo">
      <div class="video-container">
        <video autoplay loop muted playsinline src="../bengaluru-io-connect/devtools-mcp-redbus.mp4"
          style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>
      </div>
    </div>

    <!-- Slide 2: Closed Loop Debugging Flowchart -->
    <div class="slide image-slide">
      <img src="../bengaluru-io-connect/closed-loop.svg" alt="Closed Loop Debugging Flowchart"
        style="width: 80%; max-height: 80vh; object-fit: contain;">
    </div>

    <!-- Slide 3: PolicyBazaar Case Study -->
    <div class="slide custom-slide">
      <img src="../policybazaar/policybazaar-logo.png" class="slide-logo" alt="PolicyBazaar Logo">
      <div class="big-number">92%</div>
      <div class="subtitle-text">
        Policybazaar incorporated this closed-loop testing framework and reduced their manual performance auditing
        workloads
        by 92%.
      </div>
    </div>
  </div>

  <script>
    window.focus(); // Ensure keyboard events go here immediately upon load
    const slides = document.querySelectorAll('.slide');
    let current = 0;

    function showSlide(index) {
      slides[current].classList.remove('active');
      current = (index + slides.length) % slides.length;
      slides[current].classList.add('active');
    }

    document.getElementById('prev').addEventListener('click', () => showSlide(current - 1));
    document.getElementById('next').addEventListener('click', () => showSlide(current + 1));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.code === 'Space') {
        showSlide(current + 1);
      } else if (e.key === 'ArrowLeft') {
        showSlide(current - 1);
      } else if (e.key >= '1' && e.key <= '9') {
        const targetIndex = parseInt(e.key, 10) - 1;
        if (targetIndex < slides.length) {
          showSlide(targetIndex);
        }
      }
    });
  </script>
</body>

</html>
